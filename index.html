<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Take5 — Corporate Impact Search</title>
    <!-- Tailwind CSS Engine -->
    <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-[#0f141c] text-slate-100 min-h-screen flex flex-col font-sans">

    <!-- Navbar Section -->
    <header class="w-full max-w-5xl mx-auto px-6 py-6 flex justify-between items-center border-b border-slate-800">
        <div class="text-2xl font-black tracking-tighter text-emerald-400">Take5.</div>
        <div class="text-xs text-slate-400 font-mono tracking-widest uppercase">Pause • Reflect • Buy</div>
    </header>

    <!-- Main Content Container -->
    <main class="flex-grow max-w-2xl w-full mx-auto px-4 py-16 flex flex-col items-center">
        
        <!-- Main Headings -->
        <div class="text-center mb-10">
            <h1 class="text-4xl font-extrabold tracking-tight mb-3">
                Reveal Corporate Footprints
            </h1>
            <p class="text-slate-400 text-sm max-w-sm mx-auto">
                Scan public sustainability, labor records, and supply chains instantly before making a purchase.
            </p>
        </div>

        <!-- Search Bar Section -->
        <div class="w-full bg-[#161d2a] rounded-2xl p-6 border border-slate-800 shadow-xl mb-8">
            <div class="flex flex-col sm:flex-row gap-3">
                <input 
                    type="text" 
                    id="companyInput" 
                    placeholder="Enter Indian company (e.g., Tata Steel, Zomato)..." 
                    class="flex-grow bg-[#0c1017] border border-slate-700 rounded-xl px-4 py-3 text-white placeholder-slate-500 focus:outline-none focus:border-emerald-500 transition-colors"
                />
                <button 
                    onclick="triggerSearch()" 
                    id="searchBtn"
                    class="bg-emerald-500 hover:bg-emerald-600 text-slate-950 font-bold px-6 py-3 rounded-xl transition-colors whitespace-nowrap"
                >
                    Check Impact
                </button>
            </div>
            <div class="mt-4 flex gap-2 text-xs text-slate-500 items-center">
                <span class="font-mono">TRY:</span>
                <button onclick="fillSearch('Tata Steel')" class="hover:text-emerald-400 underline">Tata Steel</button>
                <button onclick="fillSearch('Zomato')" class="hover:text-emerald-400 underline">Zomato</button>
            </div>
        </div>

        <!-- Loading Spinner -->
        <div id="loader" class="hidden w-full flex flex-col items-center space-y-3 py-6">
            <div class="animate-spin rounded-full h-8 w-8 border-2 border-emerald-500 border-t-transparent"></div>
            <p class="text-xs font-mono text-slate-400 animate-pulse">Running AI Agent Analysis...</p>
        </div>

        <!-- AI Output Results Dashboard -->
        <div id="resultsCard" class="hidden w-full bg-[#161d2a] rounded-2xl p-6 border-l-4 border-emerald-500 shadow-xl">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3 mb-4">
                <h3 id="resultTitle" class="text-lg font-bold text-white">Analysis Blueprint</h3>
                <span id="dataSourceBadge" class="text-[10px] font-mono px-2 py-0.5 rounded bg-slate-800 text-slate-400 uppercase tracking-wider">Source</span>
            </div>
            <div id="resultContent" class="text-slate-300 text-sm leading-relaxed whitespace-pre-line space-y-2">
                <!-- Data lands here dynamically -->
            </div>
        </div>

    </main>

    <footer class="text-center py-6 text-xs text-slate-600 font-mono border-t border-slate-900">
        Take5 ESG Platform Engine • Open Tier System
    </footer>

    <!-- Browser to Server API Connection Scripts -->
    <script>
        // 🔴 PASTE YOUR EXACT LIVE RENDER LINK HERE
        const BACKEND_URL = "https://take5-68lw.onrender.com";

        function fillSearch(name) {
            document.getElementById('companyInput').value = name;
        }

        async function triggerSearch() {
            const inputField = document.getElementById('companyInput');
            const searchBtn = document.getElementById('searchBtn');
            const loader = document.getElementById('loader');
            const card = document.getElementById('resultsCard');
            const content = document.getElementById('resultContent');
            const title = document.getElementById('resultTitle');
            const badge = document.getElementById('dataSourceBadge');

            const companyName = inputField.value.trim();
            if(!companyName) return;

            searchBtn.disabled = true;
            loader.classList.remove('hidden');
            card.classList.add('hidden');

            try {
                const response = await fetch(`${BACKEND_URL}/api/search`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ company: companyName })
                });

                const data = await response.json();
                if (data.error) throw new Error(data.error);

                title.innerText = `${companyName} Impact Record`;
                content.innerText = data.result;
                
                if (data.source === 'database') {
                    badge.innerText = "Cached Record (Free)";
                    badge.className = "text-[10px] font-mono px-2 py-0.5 rounded bg-teal-950 text-teal-400 uppercase tracking-wider";
                } else {
                    badge.innerText = "Live AI Generation";
                    badge.className = "text-[10px] font-mono px-2 py-0.5 rounded bg-amber-950 text-amber-400 uppercase tracking-wider";
                }

                card.classList.remove('hidden');

            } catch (err) {
                alert("Could not connect to the search server. Double check that your Render live backend link is pasted properly into line 65.");
                console.error(err);
            } finally {
                searchBtn.disabled = false;
                loader.classList.add('hidden');
            }
        }
    </script>
</body>
</html>
