<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Take5 — Search any Indian company's real impact</title>
<style>
  html, body { margin: 0; padding: 0; overflow-x: hidden; }
  #take-five-root {
    overflow-x: hidden;
    --cream: #FBF8F2;
    --ink: #241019;
    --ink-soft: #83737C;
    --ink-faint: #BBA9B3;
    --emerald: #10A669;
    --emerald-deep: #0B7F4F;
    --emerald-soft: #E1F5EC;
    --mint: #2EE6AE;
    --mint-deep: #17B98C;
    --solar: #FFC93C;
    --solar-ink: #A66E00;
    --solar-soft: #FFF3D2;
    --burgundy: #6E1330;
    --burgundy-deep: #4C0D21;
    --burgundy-soft: #F6E1E7;
    --card: #FFFFFF;
    font-family: 'DM Sans', -apple-system, sans-serif;
    color: var(--ink);
    background: var(--cream);
    min-height: 100vh;
    padding: 0 0 6rem 0;
    line-height: 1.55;
  }
  #take-five-root * { box-sizing: border-box; }
  #take-five-root .wrap { max-width: 900px; margin: 0 auto; padding: 0 1.5rem; }
  #take-five-root h1, #take-five-root h2, #take-five-root h3, #take-five-root .serif {
    font-family: 'Bricolage Grotesque', 'DM Sans', sans-serif;
  }

  /* ---------- Hero ---------- */
  #take-five-root .hero {
    position: relative; max-width: 1200px; margin: 0 auto; padding: 3.5rem 1.5rem 2.5rem;
    text-align: center; overflow: visible;
  }
  #take-five-root .wordmark {
    font-size: 2rem; font-weight: 700; letter-spacing: 0.01em;
    margin: 0 auto 2.4rem; display: flex; align-items: baseline; justify-content: center; gap: 0.1rem;
  }
  #take-five-root .wordmark .wm-sans {
    font-family: 'Bricolage Grotesque', sans-serif; color: var(--emerald-deep);
  }
  #take-five-root .wordmark .wm-serif {
    font-family: 'Fraunces', serif; font-style: italic; font-weight: 600; color: var(--burgundy);
  }
  #take-five-root .headline {
    font-size: 3.4rem; font-weight: 700; line-height: 1.08; margin: 0 auto 2rem;
    max-width: 820px; letter-spacing: -0.01em; color: var(--ink); text-align: center;
  }
  #take-five-root .headline .w1 { color: var(--ink); }
  #take-five-root .headline .w2 { color: var(--emerald); }
  #take-five-root .headline .w3 { color: var(--burgundy); }

  /* ---------- Floating objects ---------- */

    position: absolute; display: flex; align-items: center; justify-content: center;
    background: var(--card); border-radius: 50%;

    line-height: 1;

  #take-five-root .float-11 { top: 96.9%; left: 25.0%; width: 82px; height: 82px; font-size: 2.15rem; transform: translate(-50%,-50%) rotate(4.4deg); border: 3px solid var(--solar); }

  #take-five-root .float-15 { top: 4.0%; left: 47.3%; width: 82px; height: 82px; font-size: 2.15rem; transform: translate(-50%,-50%) rotate(2.5deg); border: 3px solid var(--burgundy); }
  #take-five-root .float-16 { top: 79.7%; left: 7.4%; width: 82px; height: 82px; font-size: 2.15rem; transform: translate(-50%,-50%) rotate(-3.3deg); border: 3px solid var(--solar); }
  #take-five-root .float-17 { top: 110.2%; left: 20.5%; width: 82px; height: 82px; font-size: 2.15rem; transform: translate(-50%,-50%) rotate(-2.2deg); border: 3px solid var(--solar); }
  #take-five-root .float-18 { top: 37.6%; left: 7.8%; width: 82px; height: 82px; font-size: 2.15rem; transform: translate(-50%,-50%) rotate(-8.8deg); border: 3px solid var(--mint); }
  #take-five-root .float-19 { top: 37.5%; left: 102.2%; width: 82px; height: 82px; font-size: 2.15rem; transform: translate(-50%,-50%) rotate(10.9deg); border: 3px solid var(--emerald); }
  #take-five-root .float-20 { top: 97.1%; left: 57.9%; width: 82px; height: 82px; font-size: 2.15rem; transform: translate(-50%,-50%) rotate(-7.5deg); border: 3px solid var(--burgundy); }
  #take-five-root .float-21 { top: 64.7%; left: 104.8%; width: 82px; height: 82px; font-size: 2.15rem; transform: translate(-50%,-50%) rotate(6.9deg); border: 3px solid var(--emerald); }
  #take-five-root .float-22 { top: 114.8%; left: 76.7%; width: 82px; height: 82px; font-size: 2.15rem; transform: translate(-50%,-50%) rotate(8.9deg); border: 3px solid var(--burgundy); }
  #take-five-root .float-23 { top: 49.7%; left: 85.8%; width: 82px; height: 82px; font-size: 2.15rem; transform: translate(-50%,-50%) rotate(2.0deg); border: 3px solid var(--mint); }

  #take-five-root .float-25 { top: -5.5%; left: 14.8%; width: 82px; height: 82px; font-size: 2.15rem; transform: translate(-50%,-50%) rotate(4.4deg); border: 3px solid var(--emerald); }
  #take-five-root .float-26 { top: 113.1%; left: 86.3%; width: 82px; height: 82px; font-size: 2.15rem; transform: translate(-50%,-50%) rotate(0.1deg); border: 3px solid var(--mint); }
  #take-five-root .float-27 { top: -10.8%; left: -0.7%; width: 82px; height: 82px; font-size: 2.15rem; transform: translate(-50%,-50%) rotate(4.5deg); border: 3px solid var(--mint); }
  #take-five-root .float-28 { top: 21.8%; left: -4.0%; width: 82px; height: 82px; font-size: 2.15rem; transform: translate(-50%,-50%) rotate(2.5deg); border: 3px solid var(--solar); }
  #take-five-root .float-29 { top: 44.5%; left: 16.5%; width: 82px; height: 82px; font-size: 2.15rem; transform: translate(-50%,-50%) rotate(3.7deg); border: 3px solid var(--solar); }
  #take-five-root .float-30 { top: 79.1%; left: 94.3%; width: 82px; height: 82px; font-size: 2.15rem; transform: translate(-50%,-50%) rotate(-11.5deg); border: 3px solid var(--emerald); }
  #take-five-root .float-31 { top: 52.9%; left: -5.6%; width: 82px; height: 82px; font-size: 2.15rem; transform: translate(-50%,-50%) rotate(12.5deg); border: 3px solid var(--solar); }
  #take-five-root .float-32 { top: 103.0%; left: 105.1%; width: 82px; height: 82px; font-size: 2.15rem; transform: translate(-50%,-50%) rotate(0.2deg); border: 3px solid var(--solar); }
  #take-five-root .float-33 { top: -1.1%; left: 64.4%; width: 82px; height: 82px; font-size: 2.15rem; transform: translate(-50%,-50%) rotate(13.3deg); border: 3px solid var(--solar); }
  #take-five-root .float-34 { top: 112.5%; left: 8.5%; width: 82px; height: 82px; font-size: 2.15rem; transform: translate(-50%,-50%) rotate(-8.7deg); border: 3px solid var(--burgundy); }
  #take-five-root .float-35 { top: -13.6%; left: 34.7%; width: 82px; height: 82px; font-size: 2.15rem; transform: translate(-50%,-50%) rotate(-9.3deg); border: 3px solid var(--burgundy); }
  #take-five-root .float-36 { top: 71.6%; left: 84.4%; width: 82px; height: 82px; font-size: 2.15rem; transform: translate(-50%,-50%) rotate(-12.0deg); border: 3px solid var(--emerald); }
  #take-five-root .float-37 { top: 50.7%; left: 8.9%; width: 82px; height: 82px; font-size: 2.15rem; transform: translate(-50%,-50%) rotate(0.7deg); border: 3px solid var(--burgundy); }
  #take-five-root .float-38 { top: 90.9%; left: -7.9%; width: 82px; height: 82px; font-size: 2.15rem; transform: translate(-50%,-50%) rotate(4.7deg); border: 3px solid var(--burgundy); }
  @media (max-width: 980px) { #take-five-root .float-obj { display: none; } }

  /* ---------- Search ---------- */
  #take-five-root .search-panel { max-width: 620px; margin: 0 auto; padding-bottom: 0.6rem; }
  #take-five-root .search-row {
    display: flex; align-items: center; gap: 0.5rem; background: var(--card);
    border-radius: 999px; padding: 0.5rem 0.5rem 0.5rem 1.3rem;
    box-shadow: 0 16px 34px rgba(21,24,31,0.09);
  }
  #take-five-root .search-icon { color: var(--ink-faint); flex-shrink: 0; display: flex; }
  #take-five-root .search-input {
    flex: 1; font-family: 'DM Sans', sans-serif; font-size: 1rem; font-weight: 500;
    background: transparent; border: none;
    padding: 0.7rem 0.3rem; color: var(--ink); outline: none;
  }
  #take-five-root .search-input::placeholder { color: var(--ink-faint); }
  #take-five-root .search-btn {
    font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: 0.95rem;
    background: var(--emerald); color: #fff; border: none; border-radius: 999px;
    padding: 0.85rem 1.6rem; cursor: pointer; transition: background 0.15s ease, transform 0.12s ease;
    white-space: nowrap;
  }
  #take-five-root .search-btn:hover:not(:disabled) { background: var(--emerald-deep); transform: translateY(-1px); }
  #take-five-root .search-btn:disabled { opacity: 0.5; cursor: default; }
  #take-five-root .search-hint { font-size: 0.85rem; color: var(--ink-soft); margin-top: 0.8rem; font-weight: 600; }
  #take-five-root .search-hint button {
    background: none; border: none; text-decoration: underline; color: var(--emerald-deep); cursor: pointer;
    font-size: 0.85rem; padding: 0; font-weight: 700;
  }
  #take-five-root .apikey-link {
    display: block; margin: 0.6rem auto 0; background: none; border: none; text-decoration: underline;
    color: var(--ink-faint); cursor: pointer; font-size: 0.78rem; font-weight: 700;
  }
  #take-five-root .apikey-link:hover { color: var(--emerald-deep); }
  #take-five-root .apikey-row {
    display: flex; gap: 0.5rem; max-width: 520px; margin: 0.8rem auto 0;
  }
  #take-five-root .apikey-input {
    flex: 1; font-family: 'DM Sans', sans-serif; font-size: 0.85rem; font-weight: 500;
    background: var(--card); border: 1.5px solid var(--emerald-soft); border-radius: 999px;
    padding: 0.55rem 1rem; color: var(--ink); outline: none;
  }
  #take-five-root .apikey-input:focus { border-color: var(--emerald); }
  #take-five-root .apikey-save {
    font-family: 'DM Sans', sans-serif; font-weight: 700; font-size: 0.82rem;
    background: var(--ink); color: #fff; border: none; border-radius: 999px;
    padding: 0.5rem 1.1rem; cursor: pointer;
  }

  /* ---------- Trending ---------- */
  #take-five-root .trending {
    display: flex; align-items: center; justify-content: center; gap: 0.9rem; flex-wrap: wrap;
    margin-top: 1.6rem; font-size: 0.78rem; font-weight: 700; letter-spacing: 0.03em;
  }
  #take-five-root .trending-label { color: var(--ink-faint); }
  #take-five-root .trending-chip { color: var(--ink); cursor: pointer; transition: color 0.12s ease; }
  #take-five-root .trending-chip:hover { color: var(--emerald-deep); }

  /* ---------- Loading ---------- */
  #take-five-root .loading-panel { padding: 2rem 0; }
  #take-five-root .loading-step {
    display: flex; align-items: baseline; gap: 0.7rem; font-size: 0.98rem; font-weight: 600;
    color: var(--ink-faint); padding: 0.4rem 0; transition: color 0.3s ease;
  }
  #take-five-root .loading-step.active { color: var(--emerald-deep); }
  #take-five-root .loading-step.done { color: var(--emerald); }
  #take-five-root .loading-step .mark { font-family: 'Bricolage Grotesque', sans-serif; width: 1.2rem; }

  /* ---------- Error ---------- */
  #take-five-root .error-panel {
    border: none; border-radius: 20px; background: var(--burgundy-soft); padding: 1.3rem 1.5rem; margin: 1.6rem 0;
    box-shadow: 0 4px 0 var(--burgundy);
  }
  #take-five-root .error-panel h3 { margin: 0 0 0.4rem 0; color: var(--burgundy); font-size: 1.1rem; }
  #take-five-root .error-panel p { margin: 0.2rem 0; font-size: 0.92rem; color: var(--ink-soft); font-weight: 600; }
  #take-five-root .retry-btn {
    margin-top: 0.8rem; background: var(--burgundy); border: none; border-radius: 999px; color: #fff;
    padding: 0.5rem 1.1rem; cursor: pointer; font-size: 0.85rem; font-weight: 700;
  }

  /* ---------- Report header ---------- */
  #take-five-root .report { padding-top: 1.4rem; }
  #take-five-root .report-header {
    display: flex; justify-content: space-between; gap: 2rem; flex-wrap: wrap;
    background: var(--card); border-radius: 24px; padding: 1.6rem 1.8rem;
    box-shadow: 0 8px 24px rgba(21,24,31,0.06);
  }
  #take-five-root .company-name { font-size: 1.9rem; margin: 0 0 0.3rem 0; color: var(--ink); }
  #take-five-root .company-meta { font-size: 0.88rem; color: var(--ink-soft); }
  #take-five-root .company-meta div { margin: 0.2rem 0; }
  #take-five-root .company-meta b { color: var(--ink); font-weight: 700; }
  #take-five-root .period-tag {
    font-size: 0.78rem; font-weight: 700; letter-spacing: 0.02em; color: var(--emerald-deep);
    background: var(--emerald-soft); border-radius: 999px; padding: 0.35rem 0.85rem; white-space: nowrap; height: fit-content;
  }
  #take-five-root .crosswalk-tag {
    font-size: 0.76rem; color: var(--ink-soft); margin-top: 0.6rem; font-weight: 600;
  }
  #take-five-root .crosswalk-tag b { color: var(--emerald-deep); }

  /* ---------- Score seal + pillars ---------- */
  #take-five-root .score-row {
    display: flex; gap: 2.2rem; padding: 2rem 0; align-items: center; flex-wrap: wrap;
  }
  #take-five-root .seal {
    width: 140px; height: 140px; border-radius: 50%;
    background: conic-gradient(from 200deg, var(--emerald), var(--mint), var(--emerald));
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0; position: relative; box-shadow: 0 10px 26px rgba(21,24,31,0.12);
  }
  #take-five-root .seal::before {
    content: ""; position: absolute; inset: 8px; border-radius: 50%;
    background: var(--card);
  }
  #take-five-root .seal .num { position: relative; font-family: 'Bricolage Grotesque', sans-serif; font-size: 2.7rem; font-weight: 700; color: var(--ink); line-height: 1; }
  #take-five-root .seal .den { position: relative; font-size: 0.7rem; color: var(--ink-soft); letter-spacing: 0.05em; margin-top: 0.2rem; font-weight: 700; }
  #take-five-root .pillars { flex: 1; min-width: 260px; display: flex; flex-direction: column; gap: 0.75rem; }
  #take-five-root .pillar-bar-row { display: grid; grid-template-columns: 160px 1fr 34px; align-items: center; gap: 0.7rem; }
  #take-five-root .pillar-label { font-size: 0.88rem; color: var(--ink-soft); font-weight: 700; }
  #take-five-root .pillar-track { height: 12px; background: var(--emerald-soft); border-radius: 999px; position: relative; overflow: hidden; }
  #take-five-root .pillar-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--emerald), var(--burgundy)); }
  #take-five-root .pillar-score { font-size: 0.88rem; font-weight: 700; text-align: right; }
  #take-five-root .confidence-badge {
    display: inline-block; font-size: 0.76rem; font-weight: 700; padding: 0.28rem 0.75rem;
    border: none; border-radius: 999px; letter-spacing: 0.02em;
  }
  #take-five-root .conf-high { color: var(--emerald-deep); background: var(--emerald-soft); }
  #take-five-root .conf-medium { color: var(--solar-ink); background: var(--solar-soft); }
  #take-five-root .conf-low { color: var(--burgundy); background: var(--burgundy-soft); }

  /* ---------- Topic ledger ---------- */
  #take-five-root .pillar-group { margin-top: 2rem; }
  #take-five-root .pillar-group-head {
    display: flex; justify-content: space-between; align-items: baseline;
    background: var(--emerald-soft); border-radius: 16px; padding: 0.6rem 1.1rem; margin-bottom: 0.7rem;
  }
  #take-five-root .pillar-group-head h3 { font-size: 1.1rem; margin: 0; color: var(--emerald-deep); }
  #take-five-root .pillar-group-head .weight { font-size: 0.8rem; color: var(--ink-soft); font-weight: 700; }
  #take-five-root .topic-row {
    background: var(--card); border-radius: 18px; cursor: pointer; margin-bottom: 0.6rem;
    box-shadow: 0 3px 10px rgba(21,24,31,0.05); transition: box-shadow 0.15s ease, transform 0.15s ease;
  }
  #take-five-root .topic-row:hover { box-shadow: 0 6px 16px rgba(21,24,31,0.09); transform: translateY(-1px); }
  #take-five-root .topic-row-main {
    display: grid; grid-template-columns: 1fr 90px 70px 20px; align-items: center;
    gap: 0.8rem; padding: 1rem 1.2rem;
  }
  #take-five-root .topic-name { font-size: 0.96rem; font-weight: 700; }
  #take-five-root .topic-tag { font-size: 0.72rem; color: var(--ink-soft); font-style: italic; }
  #take-five-root .topic-weight { font-size: 0.82rem; color: var(--ink-soft); text-align: right; font-weight: 700; }
  #take-five-root .topic-score { font-size: 1rem; font-weight: 700; text-align: right; color: var(--emerald-deep); }
  #take-five-root .topic-chevron { text-align: center; color: var(--burgundy); transition: transform 0.15s ease; font-size: 0.9rem; }
  #take-five-root .topic-row.open .topic-chevron { transform: rotate(90deg); }
  #take-five-root .topic-detail {
    display: none; padding: 0 1.2rem 1.4rem 1.2rem;
  }
  #take-five-root .topic-row.open .topic-detail { display: block; }
  #take-five-root .topic-explain { font-size: 0.92rem; color: var(--ink-soft); margin: 1rem 0 0 0; max-width: 68ch; font-weight: 500; }

  #take-five-root .weight-math {
    display: flex; gap: 0.8rem; flex-wrap: wrap; font-size: 0.78rem; color: var(--ink-soft);
    margin-bottom: 1.2rem;
  }
  #take-five-root .weight-math div {
    background: var(--emerald-soft); border-radius: 14px; padding: 0.5rem 0.9rem;
  }
  #take-five-root .weight-math div b { color: var(--emerald-deep); display: block; font-size: 1rem; font-family: 'Bricolage Grotesque', sans-serif; }

  #take-five-root .evidence-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 1.2rem; }
  @media (max-width: 620px) { #take-five-root .evidence-cols { grid-template-columns: 1fr; } }
  #take-five-root .evidence-col h4 {
    font-size: 0.8rem; letter-spacing: 0.02em; margin: 0 0 0.5rem 0; font-weight: 800;
  }
  #take-five-root .evidence-col.pos h4 { color: var(--emerald-deep); }
  #take-five-root .evidence-col.neg h4 { color: var(--burgundy); }
  #take-five-root .evidence-item {
    font-size: 0.85rem; font-weight: 500; padding: 0.7rem 0.85rem; margin-bottom: 0.5rem; background: var(--emerald-soft);
    border-radius: 14px;
  }
  #take-five-root .evidence-col.neg .evidence-item { background: var(--burgundy-soft); }
  #take-five-root .evidence-item .src {
    display: block; margin-top: 0.35rem; font-size: 0.74rem; color: var(--ink-soft); font-weight: 700;
  }
  #take-five-root .evidence-empty { font-size: 0.82rem; color: var(--ink-faint); font-style: italic; font-weight: 600; }

  /* ---------- Footer actions ---------- */
  #take-five-root .actions-row {
    display: flex; justify-content: space-between; align-items: center; padding-top: 1.6rem; margin-top: 1.4rem;
    flex-wrap: wrap; gap: 1rem;
  }

window.TF_TOPIC_DEFINITIONS = {"Access & Affordability":"Evaluates whether the company's essential products or services (e.g. healthcare, financial services, utilities, connectivity) are priced and distributed so they are genuinely accessible to low-income, rural, or otherwise underserved populations — financial inclusion metrics, affordability relative to local income levels, service coverage in underserved geographies, and any evidence of discriminatory pricing or exclusion. Distinct from Customer Welfare, which covers the wellbeing impact of using the product rather than access to it.","Air Quality":"Evaluates the company's emissions of local and regional air pollutants excluding greenhouse gases — NOx, SOx, particulate matter, volatile organic compounds, and other hazardous air pollutants — from its facilities, and their documented impact on surrounding air quality and public health. Distinct from GHG Emissions, which covers climate-relevant gases rather than local air pollution.","Business Ethics":"Evaluates the company's management of corruption, bribery, fraud, and conflicts of interest — the strength of anti-corruption policies, whistleblower protections, and internal controls, and any substantiated findings, fines, or convictions. Distinct from Management of the Legal & Regulatory Environment, which covers sector-specific regulatory compliance rather than corruption and fraud, and from Selling Practices & Product Labeling, which covers customer-facing marketing conduct specifically.","Business Model Resilience":"Evaluates how well the company's strategy and operating model are positioned to withstand sustainability-related disruption — resource scarcity, shifting regulation, changing consumer demand, climate-related shocks — including diversification, capital allocation toward resilience, and scenario planning. A strategic, forward-looking assessment, distinct from Supply Chain Management, which covers day-to-day supplier practices rather than overall strategic adaptability.","Critical Incident Risk Management":"Evaluates the company's systems for preventing and responding to catastrophic, low-frequency operational incidents — major accidents, explosions, spills, or process-safety failures — particularly at high-hazard facilities: process safety management systems, emergency preparedness, and the frequency/severity of major incidents. Distinct from Employee Health & Safety, which covers routine day-to-day workplace injury performance rather than catastrophic events.","Customer Privacy":"Evaluates how the company collects, uses, shares, and retains customers' personal data — consent practices, data minimisation, use in profiling or algorithmic decision-making, and third-party data sharing. Distinct from Data Security, which covers the technical protection of data and systems rather than how the data is used.","Customer Welfare":"Evaluates the broader health and wellbeing impact of the company's products or services on customers during normal, intended use — e.g. nutritional impact, addictive product design, responsible lending, or over-consumption risk. Distinct from Product Quality & Safety, which covers physical defects and safety failures rather than the wellbeing impact of a properly functioning product.","Data Security":"Evaluates the company's technical and organisational controls for protecting data and IT systems from breach, theft, or unauthorised access — cybersecurity infrastructure, breach frequency and severity, and incident response. Distinct from Customer Privacy, which covers what the data is used for rather than how well it is protected.","Ecological Impacts":"Evaluates the company's impact on biodiversity, natural habitats, and ecosystem services through its own land use, operations, or extraction activities — deforestation, habitat disruption, protected-area encroachment, and biodiversity offset or restoration efforts. Distinct from Materials Sourcing & Efficiency, which covers the responsibility of raw-material procurement rather than the company's own operational land footprint.","Employee Engagement, Diversity & Inclusion":"Evaluates the company's own workforce composition and culture — gender and demographic diversity (including in leadership), pay equity across demographic groups, employee satisfaction and turnover, and inclusion programs. Distinct from Labour Practices, which covers baseline legal labour rights and compliance rather than workforce composition and culture.","Employee Health & Safety":"Evaluates the physical safety of the company's own employees and on-site contractors in their day-to-day work — injury and fatality rates, safety violations and citations, and the adequacy of safety protocols and protective equipment. Distinct from Critical Incident Risk Management, which covers catastrophic, low-frequency operational incidents rather than routine workplace safety performance.","Energy Management":"Evaluates the company's total operational energy consumption, the mix of grid, renewable, and alternative energy sources used, and the effectiveness of energy-efficiency initiatives across its facilities. Distinct from GHG Emissions, which covers the resulting emissions rather than energy sourcing and consumption, and from Product Design & Lifecycle Management, which covers the energy intensity of individual products rather than the company's total operational footprint.","GHG Emissions":"Evaluates the company's direct (Scope 1) and, where disclosed, indirect (Scope 2/3) greenhouse gas emissions at the operational/corporate level, emissions-reduction targets and performance against them, and exposure to carbon pricing or regulation. Distinct from Product Design & Lifecycle Management, which covers the carbon footprint of individual products rather than the company's aggregate emissions inventory.","Human Rights & Community Relations":"Evaluates the company's relationship with, and impact on, external communities — including indigenous communities — where it operates: land rights and resettlement, free/prior/informed consent processes, security-related human rights risks, and community grievance mechanisms. Distinct from Labour Practices, which covers the company's own workforce rather than surrounding communities.","Labour Practices":"Evaluates the company's compliance with fundamental labour rights for its own direct workforce: child labour (any evidence in the company's own operations, age-verification practices, remediation where found), forced or bonded labour, wages and working hours (minimum wage and overtime compliance), and freedom of association / collective bargaining. Scoped to the company's own employees and on-site contracted labour — supplier-level labour conditions are evaluated under Supply Chain Management, and physical workplace safety performance is evaluated under Employee Health & Safety, to avoid double-counting the same evidence twice.","Management of the Legal & Regulatory Environment":"Evaluates how proactively and effectively the company complies with and engages on the evolving regulatory landscape specific to its industry (environmental permitting, sector-specific regulation, licensing), and its track record of enforcement actions or violations tied to that regulatory environment. Distinct from Business Ethics, which covers corruption and fraud rather than sector-specific regulatory compliance.","Materials Sourcing & Efficiency":"Evaluates the responsibility of the company's raw-material procurement — sourcing from conflict-affected or deforestation-linked supply chains, use of certified/responsibly-sourced inputs — and the efficiency of material use within its own production processes. Distinct from Product Design & Lifecycle Management, which covers the material composition and end-of-life attributes of finished products rather than upstream sourcing and in-process material efficiency.","Physical Impacts of Climate Change":"Evaluates the company's exposure to, and resilience against, physical climate risks — extreme weather, flooding, sea-level rise, water stress, heat stress — affecting its facilities, operations, or supply chain, and the adequacy of its adaptation planning. Distinct from GHG Emissions, which covers the company's contribution to climate change rather than its exposure to climate change's physical effects.","Product Design & Lifecycle Management":"Evaluates the company's products across their full lifecycle, from material sourcing through end-of-life: recyclability of the product and its components; the product's own carbon footprint (embodied and/or use-phase emissions attributable to that specific product line, distinct from the company's aggregate operational GHG inventory under GHG Emissions); material composition (e.g. virgin vs. recycled inputs, hazardous substances in the finished product, distinct from responsible procurement of raw materials under Materials Sourcing & Efficiency); energy required to produce or operate the product itself (a product-level metric, distinct from the company's total operational energy consumption under Energy Management); manufacturing yield loss / waste generated per unit of that product (a product-design efficiency metric, distinct from the company's broader hazardous and non-hazardous waste handling under Waste & Hazardous Materials Management); packaging material (type, recyclability, minimisation); durability and expected lifespan; repairability (spare parts availability, repair programs, design for disassembly); biodegradability and composting compatibility; and take-back / end-of-life recovery programs offered by the company.","Product Quality & Safety":"Evaluates the physical safety and quality reliability of the company's products or services — defect and recall rates, safety certifications, and documented harm to consumers from malfunction or contamination. Distinct from Customer Welfare, which covers the wellbeing impact of a properly functioning product rather than defects or failures.","Selling Practices & Product Labeling":"Evaluates the honesty and transparency of the company's marketing, sales practices, and product labelling/claims — avoidance of deceptive advertising and mis-selling, and whether sales-incentive structures could encourage predatory or inappropriate selling. Distinct from Business Ethics, which covers corruption and fraud rather than customer-facing marketing conduct.","Supply Chain Management":"Evaluates how the company manages environmental, social, and governance risk within its upstream supply chain — supplier codes of conduct, labour and environmental auditing of suppliers (including child labour, forced labour, and safety conditions at supplier sites), traceability, and remediation of non-compliance found at suppliers. This is where supplier-level labour and environmental conditions are evaluated; Labour Practices and the environmental topics above are scoped to the company's own direct operations only, to avoid double-counting the same evidence under both a company topic and this one.","Systemic Risk Management":"Evaluates — primarily relevant to financial institutions — how the company manages risks that could contribute to instability in the broader financial system: capital adequacy, stress testing, exposure concentration, and management of interconnected counterparty risk. Distinct from Critical Incident Risk Management, which covers physical/operational catastrophic incidents rather than financial-system risk.","Waste & Hazardous Materials Management":"Evaluates the company's generation, handling, and disposal of hazardous and non-hazardous waste across its own operations — spill and contamination incidents, hazardous-waste volumes, and remediation of environmental contamination. Distinct from Product Design & Lifecycle Management, which covers manufacturing yield/waste tied to a specific product's design rather than the company's overall operational waste and hazardous-materials handling.","Water & Wastewater Management":"Evaluates the company's water withdrawal and consumption — especially in water-stressed or water-scarce regions — and the quality of wastewater discharged from its operations, including treatment and recycling practices. Distinct from Waste & Hazardous Materials Management, which covers solid and hazardous waste rather than water usage and discharge."};

  function indiaModifier(topicName){

    if (n.includes('ghg') || n.includes('climate') || n.includes('energy')) return { mult: 1.20, label: 'Climate' };

  function computeWeightedPillars(pillarsFromCrosswalk){
    return pillarsFromCrosswalk.map(p => {

        return { name: t.name, initial_weight_pct: t.weight_pct, india_modifier: mod.mult, india_category: mod.label, adjusted: t.weight_pct * mod.mult, fallback: !!t.fallback };
      });
      const sumAdjusted = withMod.reduce((a,t) => a + t.adjusted, 0);
      const topics = withMod.map(t => ({
        ...t,
        final_weight_pct: sumAdjusted > 0 ? (t.adjusted / sumAdjusted) * p.weight_pct : p.weight_pct / withMod.length

      return { name: p.name, weight_pct: p.weight_pct, topics };

      throw new Error(blockReason ? `Gemini blocked this request (${blockReason}).` : 'No output was returned. Try again.');
    }
    const parts = (candidate.content && candidate.content.parts) || [];
    const raw = parts.filter(p => typeof p.text === 'string').map(p => p.text).join('\n').trim();
    if (!raw) throw new Error('No output was returned. Try again.');
    const cleaned = raw.replace(/^```json/i, '').replace(/^```/,'').replace(/```$/,'').trim();
    const start = cleaned.indexOf('{');
    const end = cleaned.lastIndexOf('}');
    if (start === -1 || end === -1) throw new Error('The response was not valid JSON.');
    try { return JSON.parse(cleaned.slice(start, end+1)); }
    catch(e){ throw new Error('Could not parse the assessment output: ' + e.message); }
  }

  async function identifyCompany(name){
    return callGemini(IDENTIFY_SYSTEM_PROMPT, `Identify this company for Take Five: "${name}"`, true);
  }

  async function scoreCompany(companyInfo, weightedPillars){
    const topicList = [];
    weightedPillars.forEach(p => {
      p.topics.forEach(t => topicList.push({ pillar: p.name, name: t.name, final_weight_pct: Math.round(t.final_weight_pct * 100) / 100 }));
    });
    const userText = `Company: ${companyInfo.name} (${companyInfo.entity})
Primary business: ${companyInfo.primary_business}
Secondary activities: ${(companyInfo.secondary_activities || []).join(', ') || 'none reported'}
Reporting period: ${companyInfo.reporting_period}

Score these material topics (name, pillar, and final weight within the overall 100-point score are fixed \u2014 just research and score each one). Where a topic has a definition below, that definition is authoritative for what to evaluate under it \u2014 follow it precisely, including which adjacent topic it's deliberately distinct from, so evidence isn't double-counted across topics:
${topicList.map(t => {
  const def = window.TF_TOPIC_DEFINITIONS && window.TF_TOPIC_DEFINITIONS[t.name];
  return `- ${t.name} (${t.pillar}, ${t.final_weight_pct}% of overall score)${def ? `\n  Definition: ${def}` : ''}`;
}).join('\n')}`;
    return callGemini(SCORE_SYSTEM_PROMPT, userText, true);
  }

  // ---------- Assemble final result & deterministic math ----------
  function assembleResult(companyInfo, weightedPillars, crosswalkRow, scoreResponse, fallbackNote){
    const scoreByName = {};
    (scoreResponse.topics || []).forEach(t => { scoreByName[t.name] = t; });

    const pillars = weightedPillars.map(p => {
      const topics = p.topics.map(t => {
        const s = scoreByName[t.name] || {};
        return {
          name: t.name,
          initial_weight_pct: t.initial_weight_pct,
          india_modifier: t.india_modifier,
          india_category: t.india_category,
          final_weight_pct: t.final_weight_pct,
          performance_score: typeof s.performance_score === 'number' ? s.performance_score : 50,
          evidence_confidence: s.evidence_confidence || 'Low',
          explanation: s.explanation || 'No scoring detail was returned for this topic.',
          positive_evidence: s.positive_evidence || [],
          negative_evidence: s.negative_evidence || []
        };
      });
      const pillarScore = topics.reduce((sum, t) => sum + (t.performance_score * t.final_weight_pct), 0) / (p.weight_pct || 1);
      return { name: p.name, weight_pct: p.weight_pct, score: pillarScore, topics };
    });

    const overallScore = pillars.reduce((sum, p) => sum + (p.score * p.weight_pct / 100), 0);

    return {
      company: {
        name: companyInfo.name, entity: companyInfo.entity, primary_business: companyInfo.primary_business,
        secondary_activities: companyInfo.secondary_activities || [], reporting_period: companyInfo.reporting_period,
        nic_code: crosswalkRow ? crosswalkRow.nic_code : (companyInfo.nic_code || '\u2014'),
        nic_description: crosswalkRow ? crosswalkRow.nic_description : (companyInfo.nic_description || '\u2014'),
        sics_industry: crosswalkRow ? `${crosswalkRow.sics_sector} \u2014 ${crosswalkRow.sics_industry}` : '\u2014'
      },
      overall_score: overallScore,
      evidence_confidence_overall: scoreResponse.evidence_confidence_overall || 'Medium',
      pillars: pillars,
      methodology_note: [fallbackNote, scoreResponse.methodology_note].filter(Boolean).join(' ')
    };
  }

  // ---------- UI ----------
  function setHint(msg){ hintEl.textContent = msg || ''; }

  document.querySelectorAll('#take-five-root .trending-chip').forEach(chip => {
    chip.addEventListener('click', () => {
      input.value = chip.textContent.trim();
      runSearch();
    });
  });

  // ---------- Gemini API key UI ----------
  const apikeyLink = $('#tf-apikey-link');
  const apikeyRow = $('#tf-apikey-row');
  const apikeyInput = $('#tf-apikey-input');
  const apikeySave = $('#tf-apikey-save');

  function refreshApikeyLinkLabel(){
    apikeyLink.textContent = getGeminiKey() ? 'API key saved \u2713 (click to change)' : 'API key';
  }
  refreshApikeyLinkLabel();

  apikeyLink.addEventListener('click', () => {
    const showing = apikeyRow.style.display !== 'none';
    apikeyRow.style.display = showing ? 'none' : 'flex';
    if (!showing) {
      apikeyInput.value = getGeminiKey();
      apikeyInput.focus();
    }
  });
  apikeySave.addEventListener('click', () => {
    setGeminiKey(apikeyInput.value);
    apikeyRow.style.display = 'none';
    refreshApikeyLinkLabel();
    setHint('Gemini API key saved to this browser.');
  });
  apikeyInput.addEventListener('keydown', e => { if (e.key === 'Enter') apikeySave.click(); });

  function renderLoading(){
    loadingEl.style.display = 'block';
    let i = 0;
    loadingEl.innerHTML = LOADING_STEPS.map((s,idx)=>`<div class="loading-step" data-i="${idx}"><span class="mark">\u2014</span><span>${s}</span></div>`).join('');
    const stepEls = [...loadingEl.querySelectorAll('.loading-step')];
    stepEls[0].classList.add('active');
    let idx = 0;
    function advance(){
      if (idx < stepEls.length){
        stepEls[idx].classList.remove('active'); stepEls[idx].classList.add('done');
        stepEls[idx].querySelector('.mark').textContent = '\u2713';
      }
      idx++;
      if (idx < stepEls.length) stepEls[idx].classList.add('active');
    }
    return { advance, stop: () => { loadingEl.style.display = 'none'; loadingEl.innerHTML=''; } };
  }

  function confClass(level){
    const l = (level||'').toLowerCase();
    if (l === 'high') return 'conf-high'; if (l === 'medium') return 'conf-medium'; return 'conf-low';
  }

  function renderEvidenceList(items, kind){
    if (!items || !items.length) return `<div class="evidence-empty">No ${kind} evidence surfaced.</div>`;
    return items.map(it => `
      <div class="evidence-item">
        ${escapeHtml(it.text)}
        <span class="src">${escapeHtml(it.source || 'Source unspecified')} \u00b7 ${escapeHtml(it.reliability || '')}${it.severity ? ' \u00b7 ' + escapeHtml(it.severity) : ''}</span>
      </div>`).join('');
  }

  function escapeHtml(s){
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function topicRow(topic){
    const rowId = 'tf-topic-' + Math.random().toString(36).slice(2,9);
    return `
      <div class="topic-row" id="${rowId}">
        <div class="topic-row-main" data-toggle="${rowId}">
          <div>
            <div class="topic-name">${escapeHtml(topic.name)}</div>
          </div>
          <div class="topic-weight">${topic.final_weight_pct != null ? topic.final_weight_pct.toFixed(1) + '%' : '\u2014'}</div>
          <div class="topic-score">${topic.performance_score != null ? Math.round(topic.performance_score) : '\u2014'}</div>
          <div class="topic-chevron">\u203a</div>
        </div>
        <div class="topic-detail">
          <div class="weight-math">
            <div><b>${topic.performance_score != null ? Math.round(topic.performance_score) : '\u2014'}/100</b>performance score</div>
            <div><b>${topic.final_weight_pct != null ? topic.final_weight_pct.toFixed(1) : '\u2014'}%</b>share of this pillar</div>
            <div><span class="confidence-badge ${confClass(topic.evidence_confidence)}">${escapeHtml(topic.evidence_confidence || 'n/a')} confidence</span></div>
          </div>
          <div class="evidence-cols">
            <div class="evidence-col pos"><h4>Positive evidence</h4>${renderEvidenceList(topic.positive_evidence, 'positive')}</div>
            <div class="evidence-col neg"><h4>Negative evidence</h4>${renderEvidenceList(topic.negative_evidence, 'negative')}</div>
          </div>
          <p class="topic-explain">${escapeHtml(topic.explanation || '')}</p>
        </div>
      </div>`;
  }

  function renderReport(result, container){
    const c = result.company || {};
    const pillars = result.pillars || [];
    container.innerHTML = `
      <div class="report">
        <div class="report-header">
          <div>
            <h2 class="company-name">${escapeHtml(c.name || 'Unknown company')}</h2>
            <div class="company-meta">
              <div><b>Entity:</b> ${escapeHtml(c.entity || '\u2014')}</div>
              <div><b>Primary business:</b> ${escapeHtml(c.primary_business || '\u2014')}</div>
              ${c.secondary_activities && c.secondary_activities.length ? `<div><b>Secondary activities:</b> ${escapeHtml(c.secondary_activities.join(', '))}</div>` : ''}
            </div>
            <div class="crosswalk-tag">NIC <b>${escapeHtml(c.nic_code || '\u2014')}</b> \u2014 ${escapeHtml(c.nic_description || '\u2014')} &nbsp;\u00b7&nbsp; SASB/SICS: <b>${escapeHtml(c.sics_industry || '\u2014')}</b></div>
          </div>
          <div class="period-tag">${escapeHtml(c.reporting_period || 'Reporting period n/a')}</div>
        </div>

        <div class="score-row">
          <div class="seal"><div class="num">${Math.round(result.overall_score ?? 0)}</div><div class="den">TAKE FIVE / 100</div></div>
          <div class="pillars">
            ${pillars.map(p => `
              <div class="pillar-bar-row">
                <div class="pillar-label">${escapeHtml(p.name)} <span style="color:var(--ink-soft)">${p.weight_pct}%</span></div>
                <div class="pillar-track"><div class="pillar-fill" style="width:${Math.max(0,Math.min(100,p.score||0))}%"></div></div>
                <div class="pillar-score">${Math.round(p.score ?? 0)}</div>
              </div>`).join('')}
            <div style="margin-top:0.4rem;"><span class="confidence-badge ${confClass(result.evidence_confidence_overall)}">${escapeHtml(result.evidence_confidence_overall || 'n/a')} overall confidence</span></div>
          </div>
        </div>

        ${pillars.map(p => `
          <div class="pillar-group">
            <div class="pillar-group-head">
              <h3>${escapeHtml(p.name)}</h3>
              <div class="weight">fixed weight ${p.weight_pct}% \u00b7 pillar score ${Math.round(p.score ?? 0)}/100</div>
            </div>
            ${(p.topics||[]).map(t=>topicRow(t)).join('')}
          </div>`).join('')}

        <div class="actions-row">
          <div class="method-note">${escapeHtml(result.methodology_note || '')}</div>
          <button class="ghost-btn" id="tf-compare-btn">+ Compare another company</button>
        </div>
      </div>`;

    container.querySelectorAll('[data-toggle]').forEach(el => {
      el.addEventListener('click', () => {
        document.getElementById(el.getAttribute('data-toggle')).classList.toggle('open');
      });
    });
    const compareBtn = container.querySelector('#tf-compare-btn');
    if (compareBtn) compareBtn.addEventListener('click', () => {
      state.mode = 'compare';
      compareEl.innerHTML = '';
      input.value = '';
      input.focus();
      setHint('Enter a second company to compare against ' + (c.name || 'this company') + '.');
    });
  }

  function renderCompare(){
    if (state.reports.length < 2) return;
    const [a, b] = state.reports.slice(-2);
    compareEl.innerHTML = `
      <div class="compare-grid">
        ${[a,b].map(r => `
          <div class="compare-card">
            <h3>${escapeHtml(r.company?.name || '\u2014')}</h3>
            <div style="font-size:0.8rem;color:var(--ink-soft)">${escapeHtml(r.company?.sics_industry || '')}</div>
            <div class="compare-score">${Math.round(r.overall_score ?? 0)}<span style="font-size:1rem;color:var(--ink-soft)"> /100</span></div>
            ${(r.pillars||[]).map(p => `
              <div class="compare-pillar">
                <div class="pillar-track"><div class="pillar-fill" style="width:${Math.max(0,Math.min(100,p.score||0))}%"></div></div>
                <div style="text-align:right;font-weight:600;">${Math.round(p.score ?? 0)}</div>
              </div>
              <div style="font-size:0.76rem;color:var(--ink-soft);margin-top:-0.35rem;">${escapeHtml(p.name)}</div>
            `).join('')}
          </div>`).join('')}
      </div>
      <div class="compare-note">Comparisons are most meaningful within the same or closely related SASB/SICS industry. If these two companies sit in different industries, weigh the comparison with that in mind.</div>
    `;
  }

  async function runSearch(){
    const name = input.value.trim();
    if (!name) { setHint('Enter a company name to assess.'); return; }
    setHint('');
    errorEl.innerHTML = '';
    if (state.mode === 'single') reportEl.innerHTML = '';
    btn.disabled = true;
    const loader = renderLoading();
    try {
      const companyInfo = await identifyCompany(name);
      loader.advance();
      const { pillars: weightedPillars, crosswalkRow, note } = resolvePillars(companyInfo.nic_code, companyInfo.nic_description);
      loader.advance();
      const scoreResponse = await scoreCompany(companyInfo, weightedPillars);
      loader.advance();
      const result = assembleResult(companyInfo, weightedPillars, crosswalkRow, scoreResponse, note);
      loader.advance();
      state.reports.push(result);
      if (state.mode === 'compare') {
        reportEl.innerHTML = '';
        renderCompare();
      } else {
        renderReport(result, reportEl);
      }
    } catch (err) {
      errorEl.innerHTML = `
        <div class="error-panel">
          <h3>Couldn't complete the assessment</h3>
          <p>${escapeHtml(err.message || String(err))}</p>
          <button class="retry-btn" id="tf-retry">Try again</button>
        </div>`;
      const retry = document.getElementById('tf-retry');
      if (retry) retry.addEventListener('click', runSearch);
    } finally {
      loader.stop();
      btn.disabled = false;
    }
  }

  btn.addEventListener('click', runSearch);
  input.addEventListener('keydown', e => { if (e.key === 'Enter') runSearch(); });
})();
</script>
